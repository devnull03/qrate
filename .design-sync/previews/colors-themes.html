<!-- @dsCard group="Colors" viewport="760x340" name="Six themes" subtitle="data-theme swaps accent, wash and the app-chrome values only" -->
<html><head><link rel="stylesheet" href="../styles.css"><style>
  body{margin:0;padding:18px}
  .row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--rule-soft)}
  .name{width:150px;font-family:var(--font-mono);font-size:11px;color:var(--ink);flex:none}
  .sw{height:30px;flex:1;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:10px}
</style></head><body>
<p class="eyebrow">Set data-theme on html</p>
<h3 style="font-size:19px;margin:6px 0 10px">Palettes</h3>
<div data-theme="qrate-light" class="row"><span class="name">qrate-light</span>
  <span class="sw" style="background:var(--accent);color:var(--on-accent)">accent</span>
  <span class="sw" style="background:var(--hero-wash);color:var(--ink)">hero-wash</span>
  <span class="sw" style="background:var(--app-bg);color:var(--app-fg);border:1px solid var(--app-border)">app-bg</span></div>
<div data-theme="qrate-dark" class="row"><span class="name">qrate-dark</span>
  <span class="sw" style="background:var(--accent);color:var(--on-accent)">accent</span>
  <span class="sw" style="background:var(--hero-wash);color:#17140f">hero-wash</span>
  <span class="sw" style="background:var(--app-bg);color:var(--app-fg);border:1px solid var(--app-border)">app-bg</span></div>
<div data-theme="gruvbox-light" class="row"><span class="name">gruvbox-light</span>
  <span class="sw" style="background:var(--accent);color:var(--on-accent)">accent</span>
  <span class="sw" style="background:var(--hero-wash);color:#17140f">hero-wash</span>
  <span class="sw" style="background:var(--app-bg);color:var(--app-fg);border:1px solid var(--app-border)">app-bg</span></div>
<div data-theme="gruvbox-dark" class="row"><span class="name">gruvbox-dark</span>
  <span class="sw" style="background:var(--accent);color:var(--on-accent)">accent</span>
  <span class="sw" style="background:var(--hero-wash);color:#17140f">hero-wash</span>
  <span class="sw" style="background:var(--app-bg);color:var(--app-fg);border:1px solid var(--app-border)">app-bg</span></div>
<div data-theme="everforest-light" class="row"><span class="name">everforest-light</span>
  <span class="sw" style="background:var(--accent);color:var(--on-accent)">accent</span>
  <span class="sw" style="background:var(--hero-wash);color:#17140f">hero-wash</span>
  <span class="sw" style="background:var(--app-bg);color:var(--app-fg);border:1px solid var(--app-border)">app-bg</span></div>
<div data-theme="everforest-dark" class="row" style="border-bottom:0"><span class="name">everforest-dark</span>
  <span class="sw" style="background:var(--accent);color:var(--on-accent)">accent</span>
  <span class="sw" style="background:var(--hero-wash);color:#17140f">hero-wash</span>
  <span class="sw" style="background:var(--app-bg);color:var(--app-fg);border:1px solid var(--app-border)">app-bg</span></div>
</body></html>
