<html><head><link rel="stylesheet" href="../styles.css"><style>
  body{margin:0;padding:0}

<div class="gut" style="padding-top:16px;padding-bottom:16px;border-bottom:1px solid var(--rule-soft);background:var(--hero-wash)">
  <p class="note">.gut — 18px gutter, 34px at ≥48rem. Use on every full-bleed band.</p>
  <p class="eyebrow">.eyebrow — mono, uppercase, 11px, accent</p>
  <h3 class="text-xl text-ink" style="margin:4px 0 0">Band content sits inside the gutter</h3>
</div>
<div class="gut" style="padding-top:16px;padding-bottom:18px">

  </figure>
</div>
</body></html>
