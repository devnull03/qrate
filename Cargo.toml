[workspace]
resolver = "2"
members = [
  "crates/app",
  "crates/ai",
  "crates/project-wizard",
  "crates/settings",
  "crates/table",
  "crates/window-wrapper",
  "crates/workspace",
]
default-members = ["crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"

# Dev runtime was crawling on the 2k-row table because unoptimized gpui/text-shaping
# runs every frame. Optimize deps once (cached); keep our crates light so recompiles stay fast.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[workspace.dependencies]
anyhow = "1"
csv = "1.3"
gpui = "0.2.2"
gpui-component = "0.5.1"
gpui-component-assets = "0.5.1"
dirs = "6"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0.221", features = ["derive", "rc"] }
serde_json = { version = "1.0.144", features = ["preserve_order", "raw_value"] }
schemars = { version = "1.0", features = ["indexmap2"] }
