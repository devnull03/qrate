[workspace]
resolver = "2"
members = [
  "crates/app",
  "crates/ai",
  "crates/cloud-sync",
  "crates/project-wizard",
  "crates/settings",
  "crates/table",
  "crates/window-wrapper",
  "crates/workspace",
]
default-members = ["crates/app"]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"

# Dev runtime was crawling on the 2k-row table because unoptimized gpui/text-shaping
# runs every frame. Optimize deps once (cached); keep our crates light so recompiles stay fast.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[workspace.dependencies]
anyhow = "1"
csv = "1.3"
# Upgraded to unreleased gpui-component `main` (0.5.2) for native cell selection, which pulls
# Zed's `gpui` from git `main`. All zed git deps float to the default branch WITHOUT a rev so
# they unify with gpui-component's own (identically unpinned) zed deps into a single `gpui`
# crate — a pinned rev here would fork into a second, type-incompatible copy. Reproducibility
# comes from the committed Cargo.lock, which pins the exact resolved shas.
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }
dirs = "6"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0.221", features = ["derive", "rc"] }
serde_json = { version = "1.0.144", features = ["preserve_order", "raw_value"] }
schemars = { version = "1.0", features = ["indexmap2"] }
