[workspace]
resolver = "2"
members = [
  "crates/agent-runtime",
  "crates/app",
  "crates/ai",
  "crates/checks",
  "crates/data-exchange",
  "crates/diagnostics",
  "crates/plugin-api",
  "crates/plugin-host",
  "crates/preview",
  "crates/project-wizard",
  "crates/settings",
  "crates/spellcheck",
  "crates/table",
  "crates/window-wrapper",
  "crates/workspace",
]
default-members = ["crates/app"]

[workspace.package]
version = "0.3.0-alpha.2"
edition = "2024"

# Dev runtime was crawling on the 2k-row table because unoptimized gpui/text-shaping
# runs every frame. Optimize deps once (cached); keep our crates light so recompiles stay fast.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[workspace.dependencies]
alacritty_terminal = "0.26.0"
anyhow = "1"
csv = "1.3"
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "wayland", "x11"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }
dirs = "6"
log = "0.4"
# cpal-plus-symphonia glue. `preview` already decodes audio with symphonia for cover art, and the
# feature set below matches what it enables, so what this really adds is the output-device half —
# the part a hand-rolled cpal ring buffer would have to get right.
rodio = { version = "0.22", default-features = false, features = [
  "playback", "flac", "mp3", "mp4", "vorbis", "wav", "symphonia-ogg",
] }
simplelog = "0.12"
os_info = "3"
sysinfo = "0.37"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0.221", features = ["derive", "rc"] }
serde_json = { version = "1.0.144", features = ["preserve_order", "raw_value"] }
schemars = { version = "1.0", features = ["indexmap2"] }
zip = "2"
