name: Record Cloudflare deployment

# Cloudflare Workers Builds rebuilds qrate.dvnl.work on every push to this branch —
# that happens on Cloudflare's side, outside GitHub Actions. This only records that
# a build was requested, so the repo's Deployments sidebar reflects it instead of
# staying empty now that GitHub Pages is off.
on:
  push:
    branches: [site]

permissions:
  deployments: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Record the deployment
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'production',
              auto_merge: false,
              required_contexts: [],
              description: 'Cloudflare Workers Build triggered by a push to site',
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'success',
              environment_url: 'https://qrate.dvnl.work',
            });
