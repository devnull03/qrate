name: Deploy site to Pages

# Serves qrate.dvnl.work, which is a GitHub Pages custom domain pointed at the
# root — so the Astro build carries no `base`.
#
# `release` events only fire for workflows on the default branch, so publishing
# a release on `main` runs redeploy-site-on-release.yml, which dispatches this
# one. THE FILENAME IS LOAD-BEARING: that workflow runs
# `gh workflow run deploy-site.yml --ref site`.
on:
  push:
    branches: [site]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one in-flight Pages deploy; don't cancel a running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up bun
        uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          GH_TOKEN: ${{ github.token }} # consumed by the build-time release fetch

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
