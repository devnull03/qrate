name: Deploy site to Pages

# DEAD. qrate.dvnl.work is served by Cloudflare Workers now (see
# wrangler.jsonc), and redeploy-site-on-release.yml POSTs the Cloudflare deploy
# hook rather than dispatching this workflow — so nothing here reads the
# filename any more and nobody visits what it publishes.
#
# The Pages copy is also broken by construction: it uploads dist/client only,
# and /oauth/config lives in the Worker, so a fresh install cannot sign in
# against it. Delete this file.
on:
  push:
    branches: [site]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one in-flight Pages deploy; don't cancel a running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up bun
        uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          GH_TOKEN: ${{ github.token }} # consumed by the build-time release fetch

      - name: Upload the Pages artifact
        # The Cloudflare adapter splits the build: dist/client is the static
        # tree, dist/server is the Worker. Pages only wants the former, and
        # /oauth/config simply doesn't exist there until the domain moves.
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
