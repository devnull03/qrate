name: Update package managers

on:
  release:
    types: [released]

permissions:
  contents: read

concurrency:
  group: package-managers-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  homebrew:
    if: ${{ vars.HOMEBREW_TAP_UPDATES_ENABLED == 'true' && !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    concurrency:
      group: homebrew-tap
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          path: qrate
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          repository: devnull03/homebrew-tap
          ref: main
          path: homebrew-tap
          persist-credentials: false

      - name: Update Cask from the published release checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Homebrew updates require a stable vX.Y.Z tag: $tag"
            exit 1
          fi
          version="${tag#v}"
          mkdir -p "$RUNNER_TEMP/qrate-release"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern SHA256SUMS.txt --dir "$RUNNER_TEMP/qrate-release"
          asset="qrate-${version}-base-universal.dmg"
          sha256="$(awk -v asset="$asset" '$2 == asset { print $1 }' "$RUNNER_TEMP/qrate-release/SHA256SUMS.txt")"
          if [[ ! "$sha256" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error::SHA256SUMS.txt has no valid checksum for $asset"
            exit 1
          fi
          python3 qrate/scripts/update-homebrew-cask.py \
            --cask homebrew-tap/Casks/qrate.rb --version "$version" --sha256 "$sha256"
          echo "Qrate release $version -> Homebrew Cask checksum updated"

      - name: Commit Cask update to the tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::Set the HOMEBREW_TAP_TOKEN repository secret before enabling Homebrew updates."
            exit 1
          fi
          git -C homebrew-tap config user.name "github-actions[bot]"
          git -C homebrew-tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C homebrew-tap add Casks/qrate.rb
          if git -C homebrew-tap diff --cached --quiet; then
            echo "Cask already matches this release"
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          git -C homebrew-tap commit -m "qrate $version"
          gh auth setup-git
          git -C homebrew-tap push origin HEAD:main

  winget:
    if: ${{ vars.WINGET_PACKAGE_ID != '' && !github.event.release.prerelease }}
    runs-on: windows-latest
    concurrency:
      group: winget-qrate
      cancel-in-progress: false
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Download WinGetCreate and submit the MSI update
        shell: pwsh
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
          WINGET_PACKAGE_ID: ${{ vars.WINGET_PACKAGE_ID }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_NOTES_URL: ${{ github.event.release.html_url }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINGET_CREATE_GITHUB_TOKEN)) {
            throw 'Set the WINGET_CREATE_GITHUB_TOKEN repository secret before enabling WinGet updates.'
          }
          if ($env:WINGET_PACKAGE_ID -ne 'devnull03.qrate') {
            throw "Expected WINGET_PACKAGE_ID=devnull03.qrate, got '$env:WINGET_PACKAGE_ID'."
          }
          if ($env:RELEASE_TAG -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw "WinGet updates require a stable vX.Y.Z tag: $env:RELEASE_TAG"
          }
          $version = $env:RELEASE_TAG.Substring(1)
          $installerUrl = "https://github.com/devnull03/qrate/releases/download/$($env:RELEASE_TAG)/qrate-$version-x86_64.msi"
          $installer = "$installerUrl|x64|machine"
          $tool = Join-Path $env:RUNNER_TEMP 'wingetcreate.exe'
          Invoke-WebRequest -Uri 'https://aka.ms/wingetcreate/latest' -OutFile $tool
          & $tool update $env:WINGET_PACKAGE_ID `
            --urls $installer `
            --version $version `
            --release-notes-url $env:RELEASE_NOTES_URL `
            --submit --no-open
          if ($LASTEXITCODE -ne 0) { throw "WinGetCreate failed with exit code $LASTEXITCODE" }
