name: CI

# Runs on every push to `dev` and on PRs targeting `dev` or `main`. Pushes to `main` are release
# traffic and gated by the PR run that preceded them, so `workflow_dispatch` is how `main` gets
# checked on demand.
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Full debuginfo is a large share of a debug build — generating it, and on Windows writing the
  # PDB. Line tables keep backtraces readable and drop the rest.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7

      # These archives have their own top-level `pi` directory, and the macOS package must merge
      # two executables plus both sets of native helpers. A syntax check cannot catch a plausible
      # but wrong path here, so exercise the same downloads and assembly the release uses.
      - name: Check Unix agent runtime package
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x scripts/fetch-agent-runtime.sh
          destination="$RUNNER_TEMP/qrate-agent-runtime"
          if [ "$RUNNER_OS" = macOS ]; then
            scripts/fetch-agent-runtime.sh "$destination" darwin-universal
            archs="$(lipo -archs "$destination/agent/pi")"
            [[ " $archs " == *" x86_64 "* ]]
            [[ " $archs " == *" arm64 "* ]]
            test -d "$destination/agent/native/darwin/prebuilds/darwin-x64"
            test -d "$destination/agent/native/darwin/prebuilds/darwin-arm64"
            test -f "$destination/agent/node_modules/@mariozechner/clipboard/clipboard.darwin-x64.node"
            test -f "$destination/agent/node_modules/@mariozechner/clipboard/clipboard.darwin-arm64.node"
          else
            scripts/fetch-agent-runtime.sh "$destination" linux-x64
            file "$destination/agent/pi" | grep -q 'ELF 64-bit'
          fi
          test -x "$destination/agent/pi"
          test -f "$destination/agent/qrate-pi-extension/SYSTEM.md"

      - name: Check Windows agent runtime package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP "qrate-agent-runtime"
          ./scripts/fetch-agent-runtime.ps1 -Destination $destination
          $runtime = Join-Path $destination "agent"
          if (-not (Test-Path (Join-Path $runtime "pi.exe") -PathType Leaf)) {
            throw "Pi executable was not packaged at agent/pi.exe"
          }
          if (-not (Test-Path (Join-Path $runtime "qrate-pi-extension/SYSTEM.md") -PathType Leaf)) {
            throw "qrate Pi extension was not packaged beside the runtime"
          }

      # gpui_linux (wayland + x11), font-kit's fontconfig, reqwest's default
      # native-tls, and rodio's ALSA backend (`preview::playback`) are the only
      # things that need system libraries. mold replaces the single-threaded
      # default linker; macOS already ships a parallel one.
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev libfontconfig-dev libwayland-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libvulkan-dev libasound2-dev mold
          echo 'RUSTFLAGS=-C link-arg=-fuse-ld=mold' >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      # rust-lld ships with Rust and accepts the MSVC linker interface, avoiding the slower link.exe
      # without another installation step. This runs before rust-cache so its key includes the flag.
      - name: Configure Windows linker
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          'RUSTFLAGS=-C linker=rust-lld' >> $env:GITHUB_ENV

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # Without PDFium the preview crate's PDF tests assert a clean *decline* rather than a real
      # render — they pass either way, so a build that silently broke rendering would stay green.
      # ~4 MB, so it is worth fetching to make those tests mean something. ffmpeg is skipped: the
      # download is ~100 MB and every GitHub runner already has one on PATH, which the media tier
      # finds by itself.
      - name: Fetch PDFium for the preview tests
        env:
          QRATE_SKIP_FFMPEG: 1
        run: |
          chmod +x scripts/fetch-binaries.sh
          ./scripts/fetch-binaries.sh target/debug/deps
        shell: bash

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        # dead_code is allowed: this codebase deliberately scaffolds UI
        # components/helpers ahead of their consumers landing (see e.g.
        # crates/workspace/src/panels/log_viewer.rs), so unused-for-now
        # code is expected, not a bug. Every other clippy/rustc warning
        # still hard-fails.
        run: cargo clippy --workspace --all-targets -- -D warnings -A dead_code

      # nextest does not run doctests; the only ``` blocks in the workspace are `text`, so nothing
      # is lost. Test binaries still land in target/debug/deps, beside the PDFium fetched above.
      - name: Test
        run: cargo nextest run --workspace
