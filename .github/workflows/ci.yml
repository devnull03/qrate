name: CI

# Runs on every push to `dev` and on PRs targeting `dev` or `main`.
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Full debuginfo is a large share of a debug build — generating it, and on Windows writing the
  # PDB. Line tables keep backtraces readable and drop the rest.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      # gpui_linux (wayland + x11), font-kit's fontconfig, reqwest's default
      # native-tls, and rodio's ALSA backend (`preview::playback`) are the only
      # things that need system libraries.
      # mold replaces the single-threaded default linker; macOS already ships a parallel one and
      # Windows-MSVC cannot select rust-lld on stable.
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev libfontconfig-dev libwayland-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libvulkan-dev libasound2-dev mold
          echo 'RUSTFLAGS=-C link-arg=-fuse-ld=mold' >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # Without PDFium the preview crate's PDF tests assert a clean *decline* rather than a real
      # render — they pass either way, so a build that silently broke rendering would stay green.
      # ~4 MB, so it is worth fetching to make those tests mean something. ffmpeg is skipped: the
      # download is ~100 MB and every GitHub runner already has one on PATH, which the media tier
      # finds by itself.
      - name: Fetch PDFium for the preview tests
        env:
          QRATE_SKIP_FFMPEG: 1
        run: |
          chmod +x scripts/fetch-binaries.sh
          ./scripts/fetch-binaries.sh target/debug/deps
        shell: bash

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        # dead_code is allowed: this codebase deliberately scaffolds UI
        # components/helpers ahead of their consumers landing (see e.g.
        # crates/workspace/src/panels/log_viewer.rs), so unused-for-now
        # code is expected, not a bug. Every other clippy/rustc warning
        # still hard-fails.
        run: cargo clippy --workspace --all-targets -- -D warnings -A dead_code

      # nextest does not run doctests; the only ``` blocks in the workspace are `text`, so nothing
      # is lost. Test binaries still land in target/debug/deps, beside the PDFium fetched above.
      - name: Test
        run: cargo nextest run --workspace
