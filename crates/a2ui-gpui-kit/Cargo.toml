[package]
name = "a2ui-gpui-kit"
version = "0.1.0"
edition.workspace = true
description = "Render Google's A2UI (v1.0) agent-to-UI protocol with gpui-kit (gpui-component) widgets"
license = "MIT OR Apache-2.0"
repository = "https://github.com/devnull03/qrate"
readme = "README.md"
keywords = ["a2ui", "gpui", "agent", "ui", "renderer"]
categories = ["gui", "parser-implementations"]
publish = true

[lib]
name = "a2ui_gpui_kit"

[dependencies]
gpui.workspace = true
gpui-component.workspace = true
log.workspace = true
regex = "1"
serde.workspace = true
serde_json.workspace = true
thiserror = "2"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
