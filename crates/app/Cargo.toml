[package]
name = "app"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
gpui-component.workspace = true
gpui-component-assets.workspace = true
dirs.workspace = true
log.workspace = true
simplelog.workspace = true
os_info.workspace = true
sysinfo.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
# The agent bridge's request/response types; the transport lives here because only the
# composition root links both the contract and the live table.
ai = { path = "../ai" }
# The Google refresh token goes in the platform credential store rather than the settings DB:
# it never expires on its own, so anything holding it can reach the user's Drive indefinitely.
keyring = { version = "3", features = [
  "apple-native", "windows-native", "sync-secret-service",
] }
window-wrapper = { path = "../window-wrapper" }
project-wizard = { path = "../project-wizard" }
checks = { path = "../checks" }
data-exchange = { path = "../data-exchange" }
diagnostics = { path = "../diagnostics" }
preview = { path = "../preview" }
settings = { path = "../settings" }
# The dictionary is half a megabyte, so only the composition root links it — see `crates/spellcheck`.
spellcheck = { path = "../spellcheck" }
table = { path = "../table" }
plugin-api = { path = "../plugin-api" }
# Plugins are loaded here and nowhere else — see `plugin_host::reload`.
plugin-host = { path = "../plugin-host" }
workspace = { path = "../workspace" }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
# `#[gpui::test]` and TestAppContext are behind this feature.
gpui = { workspace = true, features = ["test-support"] }
