[package]
name = "spellcheck"
version.workspace = true
edition.workspace = true

[dependencies]
diagnostics = { path = "../diagnostics" }
settings = { path = "../settings" }
gpui.workspace = true
log.workspace = true
# Hunspell-compatible and language-agnostic: a second language is an .aff/.dic pair dropped in
# the data dir, not a fork. Its only two dependencies are a hasher, so the dictionary is the
# weight here, not the crate.
spellbook = "0.4"
# Variant review compares what people see while normalizing Unicode representation and case.
unicode-normalization = "0.1"
caseless = "0.2"
# Damerau-Levenshtein counts a neighbouring transposition as one edit, which matches common typos.
strsim = "0.11"
# Downloading a dictionary the user picked. Blocking like `data-exchange`'s fetch and for the same
# reason: gpui's executor is not a tokio reactor, so this runs on the background executor.
reqwest = { version = "0.12", features = ["blocking"] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
