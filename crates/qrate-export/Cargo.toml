[package]
name = "qrate-export"
version = "0.1.0"
edition.workspace = true
license = "AGPL-3.0-only"
description = "Read qrate projects and write shared export formats in Rust and WebAssembly"
repository = "https://github.com/devnull03/qrate"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
wasm = ["dep:wasm-bindgen", "dep:js-sys", "dep:serde", "dep:serde-wasm-bindgen", "rusqlite/serialize", "rust_xlsxwriter/wasm"]

[dependencies]
rusqlite.workspace = true
csv.workspace = true
serde_json.workspace = true
zip = { version = "2", default-features = false, features = ["deflate"] }
rust_xlsxwriter = "0.99.1"
thiserror = "2"
log = "0.4"
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
serde = { version = "1", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }

[dev-dependencies]
calamine.workspace = true
tempfile.workspace = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
