[package]
name = "checks"
version.workspace = true
edition.workspace = true

[dependencies]
ai = { path = "../ai" }
capability = { path = "../capability" }
schemars.workspace = true
diagnostics = { path = "../diagnostics" }
settings = { path = "../settings" }
gpui.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
fetch = { path = "../fetch" }
# The reference EDTF (ISO 8601-2) implementation, for the Date check. MPL-2.0, which is
# compatible with this repo's AGPL-3.0. Hand-parsing that grammar is how you get a validator
# that is subtly wrong about seasons, intervals, and unspecified digits.
edtf = "0.2"

[dev-dependencies]
futures = "0.3"
reqwest_client.workspace = true
gpui = { workspace = true, features = ["test-support"] }
