[package]
name = "preview"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
dirs.workspace = true
log.workspace = true
gpui.workspace = true
gpui-component.workspace = true
# Deliberately the same version and a subset of the features Zed enables on gpui's own copy, so
# cargo's feature unification adds nothing to it. Notably absent: `avif`, whose decoder would drag
# a C dav1d build into the whole workspace — see `can_preview`.
image = { version = "0.25", default-features = false, features = [
  "bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp",
] }
rodio.workspace = true
zip.workspace = true
pdfium-render = { version = "0.9.3", default-features = false, features = ["pdfium_latest", "image_025", "thread_safe"] }
# Held at 0.5 to match what `rodio` depends on: cargo unifies them into one copy, where 0.6 would
# ship two whole symphonia trees in the binary. Move both together or neither.
symphonia = { version = "0.5.5", default-features = false, features = ["mp3", "aac", "alac", "isomp4", "ogg", "vorbis", "flac", "wav", "pcm"] }

[dev-dependencies]
# `#[gpui::test]`, TestAppContext, and run_test are all behind this feature.
gpui = { workspace = true, features = ["test-support"] }

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_Com"] }

[target.'cfg(target_os = "linux")'.dependencies]
mime_guess = "2.0.5"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-foundation = "0.3.2"
objc2-quick-look-thumbnailing = { version = "0.3.2", features = ["QLThumbnailGenerator", "QLThumbnailGenerationRequest", "QLThumbnailRepresentation"] }
