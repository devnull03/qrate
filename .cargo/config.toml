[build]
# 16 logical cores, but a full gpui rebuild at -j16 starves the editor and the app.
# Leaves headroom so the machine stays usable while cargo works.
jobs = 10

[target.x86_64-pc-windows-msvc]
# link.exe dominates test builds, since every test binary links gpui; rust-lld ships with rustup.
linker = "rust-lld.exe"

[env]
# Make Rust artifacts path-independent so zccache can reuse them across worktrees.
ZCCACHE_PATH_REMAP = "auto"
